# Tidepool Count's checks on every push (a volunteers' app like Shoreline Crew, built with Expo SDK 58).
# Its package.json "test" script is "jest --watchAll", like the course app's.
# Three mistakes below: ci.test.ts names them. Fix this file, not the test.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Types, lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npm test
