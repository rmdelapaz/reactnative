# Shoreline Crew, end to end: a volunteer signs in on the Profile tab, sees their name, signs out.
# Start the app in Expo Go first (npx expo start, then open it on the device), then run:
#   maestro test .maestro/sign-in.yaml
appId: host.exp.Exponent # Expo Go's id. A development build has the app's own (Module 9)
env:
  APP_URL: exp://192.168.1.42:8081 # the exp:// address under the QR code: yours differs
---
# Expo Go runs your project inside itself: open the project's address, not the app
- openLink: ${APP_URL}
- extendedWaitUntil:
    visible: Upcoming cleanups
    timeout: 60000 # the first time, the phone downloads the whole app from Metro
- tapOn: Profile.* # the tab: on an iPhone its name is "Profile, tab, 4 of 4"
- tapOn: Sign in
- tapOn: Email
- inputText: theo.nakamura@example.com
- tapOn: Password
- inputText: shoreline-demo
- pressKey: Enter # the password's return key signs in (Lesson 5.4)
- assertVisible: Theo Nakamura
- takeScreenshot: signed-in
- tapOn: Sign out
- assertVisible: Sign in
